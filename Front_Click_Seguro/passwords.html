<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseñas - Click Seguro</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scan-line"></div>

    <header class="nav">
        <a class="marca" href="dashboard.html">
            <img src="images/logo.svg" alt="Click Seguro">
            CLICK SEGURO
        </a>
        <nav>
            <a href="dashboard.html">ENLACES</a>
            <a href="archivos.html">ARCHIVOS</a>
            <a href="documentos.html">DOCUMENTOS</a>
            <a href="dominios.html">DOMINIOS</a>
            <a href="passwords.html" class="active">CONTRASEÑAS</a>
            <a href="history.html">HISTORIAL</a>
            <a href="estadisticas.html">MIS STATS</a>
            <a href="globales.html">GLOBALES</a>
            <a href="reportar.html">REPORTAR</a>
        </nav>
        <div style="display:flex; align-items:center; gap:1rem;">
            <span class="nav-usuario" id="user-name">Usuario</span>
            <button id="logout-btn" class="btn peligro" style="font-size:0.75rem; padding:4px 10px;">SALIR</button>
        </div>
    </header>

    <main class="contenedor">
        <h1 style="font-family:var(--font-display); color:var(--cyber-green); margin-bottom:0.5rem;">Contraseñas</h1>
        <p class="muted" style="margin-bottom:2rem;">Todo ocurre en tu navegador. Lo que escribes aquí <strong>no se envía</strong> a nuestro servidor.</p>

        <section class="panel">
            <h2>Medir fortaleza y comprobar filtraciones</h2>
            <label for="pw">Contraseña</label>
            <div class="fila">
                <input id="pw" type="password" autocomplete="off" style="flex:1;">
                <button class="btn sec" type="button" id="pw-ver">Mostrar</button>
            </div>
            <div class="medidor" style="margin-top:0.5rem; background:rgba(0,0,0,0.6); height:6px; border-radius:3px;">
                <div id="pw-barra" style="width:0%; height:100%; background:var(--cyber-red); border-radius:3px; transition:all 0.3s;"></div>
            </div>
            <p id="pw-nivel" style="margin-top:0.5rem; font-family:var(--font-display);">SEGURIDAD: NULA</p>
            
            <button class="btn" type="button" id="pw-filtrada" style="margin-top:1rem;">Comprobar si fue filtrada (HaveIBeenPwned)</button>
            <p id="pw-resultado" class="muted" style="margin-top:1rem;"></p>
        </section>

        <section class="panel">
            <h2>Generar una contraseña segura</h2>
            <label for="gen-long">Longitud: <span id="gen-long-val">16</span></label>
            <input id="gen-long" type="range" min="8" max="64" value="16" style="width:100%; margin:1rem 0;">
            <div class="opciones" style="display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1rem;">
                <label><input type="checkbox" id="gen-min" checked> minúsculas</label>
                <label><input type="checkbox" id="gen-may" checked> MAYÚSCULAS</label>
                <label><input type="checkbox" id="gen-num" checked> números</label>
                <label><input type="checkbox" id="gen-sim" checked> símbolos</label>
            </div>
            <div class="fila">
                <input id="gen-salida" class="mono" readonly aria-label="Contraseña generada" style="flex:1;">
                <button class="btn sec" type="button" id="gen-copiar">Copiar</button>
            </div>
            <button class="btn" type="button" id="gen-crear" style="margin-top:1rem;">Generar</button>
        </section>
    </main>

    <script type="module">
        import { Auth, UI } from './js/api.js';

        async function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) window.location.href = 'index.html';
            else document.getElementById('user-name').textContent = user.nombre;
        }

        // --- Medidor de fortaleza con deteccion de patrones comunes (HU-14) ---
        const pwInput = document.getElementById('pw');
        const pwBarra = document.getElementById('pw-barra');
        const pwNivel = document.getElementById('pw-nivel');
        const btnFiltrada = document.getElementById('pw-filtrada');

        function evaluarFortaleza(val) {
            document.getElementById('pw-resultado').textContent = '';
            
            if (!val) {
                pwBarra.style.width = '0%';
                pwNivel.textContent = 'SEGURIDAD: NULA';
                pwNivel.style.color = 'var(--cyber-muted)';
                return;
            }
            
            let score = 0;
            if (val.length >= 8) score++;
            if (val.length >= 12) score++;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            // Detectar patrones comunes o repeticiones simples (criterio obligatorio HU-14)
            const tienePatronComun = /(1234|abcd|qwerty|password|admin|welcome|login|1111|0000|aaaa)/i.test(val)
                || /^(.)\1{3,}$/.test(val);

            if (tienePatronComun) {
                score = Math.max(1, score - 2);
            }

            const pct = Math.min(100, Math.round((score / 5) * 100));
            pwBarra.style.width = pct + '%';

            const faltantes = [];
            if (val.length < 12) faltantes.push('mínimo 12 caracteres');
            if (!/[a-z]/.test(val)) faltantes.push('minúsculas');
            if (!/[A-Z]/.test(val)) faltantes.push('mayúsculas');
            if (!/[0-9]/.test(val)) faltantes.push('números');
            if (!/[^A-Za-z0-9]/.test(val)) faltantes.push('símbolos');
            if (tienePatronComun) faltantes.push('evitar secuencias o palabras comunes');

            const consejo = faltantes.length ? ` — Mejora agregando: ${faltantes.join(', ')}` : ' — Combinación robusta y sin patrones obvios';

            if (score <= 2) {
                pwBarra.style.background = 'var(--cyber-red)';
                pwNivel.style.color = 'var(--cyber-red)';
                pwNivel.textContent = `SEGURIDAD DÉBIL (${pct}%)${consejo}`;
            } else if (score <= 3) {
                pwBarra.style.background = 'var(--cyber-yellow)';
                pwNivel.style.color = 'var(--cyber-yellow)';
                pwNivel.textContent = `SEGURIDAD MEDIA (${pct}%)${consejo}`;
            } else {
                pwBarra.style.background = 'var(--cyber-green)';
                pwNivel.style.color = 'var(--cyber-green)';
                pwNivel.textContent = `SEGURIDAD FUERTE (${pct}%)${consejo}`;
            }
        }

        pwInput.addEventListener('input', function() {
            evaluarFortaleza(this.value);
        });

        document.getElementById('pw-ver').addEventListener('click', function() {
            pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
            this.textContent = pwInput.type === 'password' ? 'Mostrar' : 'Ocultar';
        });

        // --- Comprobacion de filtraciones (K-Anonymity con HaveIBeenPwned - HU-15) ---
        btnFiltrada.addEventListener('click', async function() {
            const val = pwInput.value;
            const resultadoEl = document.getElementById('pw-resultado');
            if (!val) {
                pwInput.classList.add('input-error');
                resultadoEl.textContent = 'Escribe una contraseña en el campo superior para comprobar si fue filtrada.';
                resultadoEl.style.color = 'var(--cyber-red)';
                return;
            }

            UI.lockButton(this, 'Verificando huella SHA-1...');
            resultadoEl.style.color = 'var(--cyber-cyan)';
            resultadoEl.textContent = 'Consultando base de datos pública de filtraciones (k-anonimato)...';
            
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(val);
                const hashBuffer = await crypto.subtle.digest('SHA-1', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
                
                const prefix = hash.substring(0, 5);
                const suffix = hash.substring(5);
                
                const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
                if (!response.ok) {
                    throw new Error('Servicio no disponible');
                }
                const text = await response.text();
                
                let found = false;
                let count = 0;
                const lines = text.split('\n');
                for (const line of lines) {
                    const [hashSuffix, times] = line.split(':');
                    if (hashSuffix && hashSuffix.trim() === suffix) {
                        found = true;
                        count = parseInt(times, 10);
                        break;
                    }
                }

                if (found) {
                    resultadoEl.innerHTML = `<span class="texto-riesgo--peligroso">[ALERTA: CONTRASEÑA FILTRADA]</span> Esta clave apareció <strong>${count.toLocaleString()} veces</strong> en filtraciones públicas (prefijo SHA-1 enviado: <span class="mono">${prefix}*****</span>). No la utilices en ninguna cuenta.`;
                } else {
                    resultadoEl.innerHTML = `<span class="texto-riesgo--seguro">[NO FILTRADA]</span> No se encontraron coincidencias en HaveIBeenPwned (prefijo SHA-1 consultado: <span class="mono">${prefix}*****</span>). Nota: que una clave no esté filtrada no equivale automáticamente a que sea segura si es corta o predecible.`;
                }
            } catch (error) {
                resultadoEl.style.color = 'var(--cyber-yellow)';
                resultadoEl.textContent = 'El servicio externo de verificación no responde en este momento. Puedes seguir usando el medidor y generador local sin inconvenientes.';
            } finally {
                UI.unlockButton(this);
            }
        });

        // --- Generador criptografico seguro en el navegador (HU-14) ---
        const genLong = document.getElementById('gen-long');
        const genLongVal = document.getElementById('gen-long-val');
        const genSalida = document.getElementById('gen-salida');

        genLong.addEventListener('input', () => {
            genLongVal.textContent = genLong.value;
        });

        document.getElementById('gen-crear').addEventListener('click', () => {
            const length = parseInt(genLong.value, 10);
            const useMin = document.getElementById('gen-min').checked;
            const useMay = document.getElementById('gen-may').checked;
            const useNum = document.getElementById('gen-num').checked;
            const useSim = document.getElementById('gen-sim').checked;

            const conjuntos = [];
            if (useMin) conjuntos.push('abcdefghijklmnopqrstuvwxyz');
            if (useMay) conjuntos.push('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
            if (useNum) conjuntos.push('0123456789');
            if (useSim) conjuntos.push('!@#$%^&*()_+~|}{[]:;?><,./-=');

            if (conjuntos.length === 0) {
                UI.alert('Atención', 'Selecciona al menos un tipo de carácter (minúsculas, MAYÚSCULAS, números o símbolos).');
                return;
            }

            const todosLosCaracteres = conjuntos.join('');
            const caracteresElegidos = [];
            const valoresAleatorios = new Uint32Array(length);
            crypto.getRandomValues(valoresAleatorios);

            // Garantizar al menos un caracter de cada conjunto seleccionado
            conjuntos.forEach((conjunto, idx) => {
                caracteresElegidos.push(conjunto[valoresAleatorios[idx] % conjunto.length]);
            });

            // Completar el resto de la longitud solicitada
            for (let i = conjuntos.length; i < length; i++) {
                caracteresElegidos.push(todosLosCaracteres[valoresAleatorios[i] % todosLosCaracteres.length]);
            }

            // Mezclar aleatoriamente la posicion de los caracteres con Web Crypto API
            const indicesMezcla = new Uint32Array(caracteresElegidos.length);
            crypto.getRandomValues(indicesMezcla);
            for (let i = caracteresElegidos.length - 1; i > 0; i--) {
                const j = indicesMezcla[i] % (i + 1);
                const temp = caracteresElegidos[i];
                caracteresElegidos[i] = caracteresElegidos[j];
                caracteresElegidos[j] = temp;
            }

            const nuevaClave = caracteresElegidos.join('');
            genSalida.value = nuevaClave;

            // Cargar tambien en el medidor superior para demostrar su fortaleza al instante
            pwInput.value = nuevaClave;
            evaluarFortaleza(nuevaClave);
        });

        document.getElementById('gen-copiar').addEventListener('click', async () => {
            if (!genSalida.value) {
                await UI.alert('Aviso', 'Primero haz clic en "Generar" para crear una contraseña.');
                return;
            }
            await navigator.clipboard.writeText(genSalida.value);
            await UI.alert('Contraseña copiada al portapapeles', 'Ya puedes pegarla de forma segura con Ctrl + V.');
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try { await Auth.logout(); } catch (e) {}
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        checkAuth();
    </script>
</body>
</html>
