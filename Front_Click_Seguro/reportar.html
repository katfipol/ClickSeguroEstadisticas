<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar - Click Seguro</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="grid-bg"></div>
    <div class="scan-line"></div>

    <header class="nav">
        <a class="marca" href="dashboard.html">
            <img src="images/logo.svg" alt="Click Seguro">
            CLICK SEGURO
        </a>
        <nav>
            <a href="dashboard.html">ENLACES</a>
            <a href="archivos.html">ARCHIVOS</a>
            <a href="documentos.html">DOCUMENTOS</a>
            <a href="dominios.html">DOMINIOS</a>
            <a href="passwords.html">CONTRASEÑAS</a>
            <a href="history.html">HISTORIAL</a>
            <a href="estadisticas.html">MIS STATS</a>
            <a href="globales.html">GLOBALES</a>
            <a href="reportar.html" class="active">REPORTAR</a>
        </nav>
        <div style="display:flex; align-items:center; gap:1rem;">
            <span class="nav-usuario" id="user-name">Usuario</span>
            <button id="logout-btn" class="btn peligro" style="font-size:0.75rem; padding:4px 10px;">SALIR</button>
        </div>
    </header>

    <main class="contenedor">
        <h1 style="font-family:var(--font-display); color:var(--cyber-green); margin-bottom:0.5rem;">Reportar una URL sospechosa</h1>
        <p class="muted" style="margin-bottom:2rem;">Ayuda a la comunidad a mantenerse segura reportando enlaces maliciosos.</p>

        <section class="panel">
            <form id="report-form" novalidate>
                <div class="form-group">
                    <label for="url">URL sospechosa</label>
                    <input id="url" name="url" class="mono" placeholder="https://ejemplo-malicioso.com" required>
                    <span class="error" id="url-error"></span>
                </div>

                <div class="form-group">
                    <label for="motivo">Motivo (opcional, máx. 500 caracteres)</label>
                    <textarea id="motivo" name="motivo" rows="4" placeholder="Describe por qué crees que es peligrosa (phishing, malware, estafa...)"></textarea>
                    <span class="error" id="motivo-error"></span>
                </div>

                <div id="report-msg" class="muted" style="margin-bottom:1rem;"></div>
                <button type="submit" class="btn">Enviar reporte</button>
            </form>
        </section>
    </main>

    <script type="module">
        import { Auth, Reports, UI } from './js/api.js';

        async function checkAuth() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) window.location.href = 'index.html';
            else document.getElementById('user-name').textContent = user.nombre;
        }

        // Si se recibio ?url=... desde la vista de resultados, precargarla en el campo
        const urlParam = new URLSearchParams(window.location.search).get('url');
        if (urlParam) {
            document.getElementById('url').value = urlParam;
        }

        const urlInput = document.getElementById('url');
        const motivoInput = document.getElementById('motivo');
        const msgEl = document.getElementById('report-msg');
        const patronUrl = /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z0-9-]{2,}(\/.*)?$/i;

        const validarUrl = UI.vincularValidacionEnVivo(urlInput, (valor) => {
            const limpia = valor.trim();
            if (!limpia) return 'Ingresa la URL sospechosa que deseas reportar.';
            if (!patronUrl.test(limpia)) {
                return 'El formato de la URL no es válido. Ejemplo: https://sitio-sospechoso.com';
            }
            return '';
        });

        const validarMotivo = UI.vincularValidacionEnVivo(motivoInput, (valor) => {
            if (valor.trim().length > 500) {
                return `El motivo no puede superar los 500 caracteres (actual: ${valor.trim().length}).`;
            }
            return '';
        });

        document.getElementById('report-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const urlValida = validarUrl();
            const motivoValido = validarMotivo();
            if (!urlValida || !motivoValido) {
                return;
            }

            const url = urlInput.value.trim();
            const motivo = motivoInput.value.trim();
            const submitBtn = this.querySelector('button[type="submit"]');

            UI.lockButton(submitBtn, 'Enviando...');
            try {
                msgEl.style.color = 'var(--cyber-cyan)';
                msgEl.textContent = 'Enviando reporte...';
                await Reports.store(url, motivo);
                msgEl.textContent = '';
                this.reset();
                urlInput.dataset.validado = 'false';
                motivoInput.dataset.validado = 'false';
                UI.limpiarErrorCampo(urlInput);
                UI.limpiarErrorCampo(motivoInput);
                await UI.alert('Reporte registrado', 'Tu reporte fue registrado exitosamente. Gracias por ayudar a mantener la web segura.');
            } catch (error) {
                msgEl.textContent = '';
                UI.mostrarErrorCampo(urlInput, error.message || 'No se pudo enviar el reporte.');
            } finally {
                UI.unlockButton(submitBtn);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            try { await Auth.logout(); } catch (e) {}
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        checkAuth();
    </script>
</body>
</html>
